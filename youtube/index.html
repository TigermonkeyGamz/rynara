    <!-- ============================= -->
    <!-- YOUTUBE JAVASCRIPT -->
    <!-- ============================= -->

    <script>


        /* ========================================== */
        /* YOUTUBE CHANNEL SETTINGS */
        /* ========================================== */


        /*
         * PUT YOUR ACTUAL YOUTUBE CHANNEL ID HERE.
         *
         * It normally starts with "UC".
         *
         * Example:
         *
         * const CHANNEL_ID = "UC123456789...";
         *
         */

        const CHANNEL_ID =
            "UCb9XSwviXssQpDhFptXf7LA";


        /*
         * How many videos should appear?
         */

        const VIDEO_COUNT = 6;



        /* ========================================== */
        /* LOAD VIDEOS */
        /* ========================================== */

        async function loadYouTubeVideos() {


            const videoGrid =
                document.getElementById("video-grid");


            try {


                /*
                 * YouTube's public RSS feed.
                 */

                const feedURL =
                    `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;


                /*
                 * Convert the RSS feed into JSON.
                 *
                 * This allows GitHub Pages to display
                 * the videos without needing your own
                 * server.
                 */

                const response =
                    await fetch(
                        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedURL)}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load YouTube feed."
                    );

                }


                const data =
                    await response.json();


                if (
                    !data.items ||
                    data.items.length === 0
                ) {

                    videoGrid.innerHTML = `
                        <div class="error-message">
                            No videos found.
                        </div>
                    `;

                    return;

                }


                /*
                 * Remove loading message.
                 */

                videoGrid.innerHTML = "";



                /* ================================== */
                /* CREATE VIDEO CARDS */
                /* ================================== */

                data.items
                    .slice(0, VIDEO_COUNT)
                    .forEach(video => {


                        /*
                         * Get YouTube video ID.
                         */

                        const videoID =
                            video.guid
                                .split(":")
                                .pop();


                        /*
                         * Format date.
                         */

                        const date =
                            new Date(video.pubDate);


                        const formattedDate =
                            date.toLocaleDateString(
                                undefined,
                                {
                                    year: "numeric",

                                    month: "long",

                                    day: "numeric"
                                }
                            );


                        /*
                         * Create card.
                         */

                        const card =
                            document.createElement("article");


                        card.className =
                            "video-card";


                        /*
                         * Build card contents.
                         */

                        card.innerHTML = `

                            <a
                                class="video-thumbnail-link"
                                href="https://www.youtube.com/watch?v=${videoID}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <img
                                    class="video-thumbnail"
                                    src="https://i.ytimg.com/vi/${videoID}/hqdefault.jpg"
                                    alt="${escapeHTML(video.title)}"
                                    loading="lazy"
                                >

                            </a>


                            <div class="video-info">


                                <h2 class="video-title">
                                    ${escapeHTML(video.title)}
                                </h2>


                                <div class="video-date">
                                    ${formattedDate}
                                </div>


                                <a
                                    class="watch-button"
                                    href="https://www.youtube.com/watch?v=${videoID}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    WATCH VIDEO →
                                </a>


                            </div>

                        `;


                        videoGrid.appendChild(card);

                    });

            }


            catch (error) {


                console.error(
                    "YouTube loading error:",
                    error
                );


                videoGrid.innerHTML = `

                    <div class="error-message">

                        <p>
                            Unable to load videos right now.
                        </p>

                        <p>
                            <a
                                href="https://www.youtube.com/@TigermonkeyGamz"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Visit my YouTube channel →
                            </a>
                        </p>

                    </div>

                `;

            }

        }



        /* ========================================== */
        /* HTML ESCAPING */
        /* ========================================== */

        function escapeHTML(text) {


            const element =
                document.createElement("div");


            element.textContent =
                text;


            return element.innerHTML;

        }



        /* ========================================== */
        /* START */
        /* ========================================== */

        loadYouTubeVideos();


    </script>
